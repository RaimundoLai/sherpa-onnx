name: Build npm-addon

on:
  push:
    branches:
      - builder
  workflow_dispatch:

jobs:
  # =================================================================================================
  # Windows CUDA Build (Updated for ONNX Runtime 1.22.1)
  # =================================================================================================
  npm-addon-win-x64-cuda:
    runs-on: windows-2022
    steps:
      - name: Clone sherpa-onnx repository
        uses: actions/checkout@v4
        with:
          repository: RaimundoLai/sherpa-onnx
          branch: dev

      - name: Setup Python 3.8
        uses: actions/setup-python@v5
        with:
          python-version: "3.8"

      - uses: actions/setup-node@v4
        with:
          registry-url: 'https://registry.npmjs.org'

      - name: Download ONNX Runtime 1.22.1 GPU
        shell: bash
        run: |
          curl -SL -O https://github.com/microsoft/onnxruntime/releases/download/v1.22.1/onnxruntime-win-x64-gpu-1.22.1.zip
          unzip -q onnxruntime-win-x64-gpu-1.22.1.zip
          rm onnxruntime-win-x64-gpu-1.22.1.zip

      - name: Build sherpa-onnx (CUDA)
        shell: bash
        run: |
          export SHERPA_ONNXRUNTIME_LIB_DIR=$PWD/onnxruntime-win-x64-gpu-1.22.1/lib
          export SHERPA_ONNXRUNTIME_INCLUDE_DIR=$PWD/onnxruntime-win-x64-gpu-1.22.1/include
          
          mkdir build
          cd build
          cmake \
            -Wno-dev \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=./install \
            -DBUILD_SHARED_LIBS=ON \
            -DSHERPA_ONNX_ENABLE_WEBSOCKET=OFF \
            -DSHERPA_ONNX_ENABLE_PORTAUDIO=OFF \
            -DSHERPA_ONNX_ENABLE_BINARY=OFF \
            -DSHERPA_ONNX_ENABLE_GPU=ON \
            ..

          cmake --build . --config Release --target install -- -m:6
          
          echo "----------"
          ls -lh install/lib
          echo "---------- Copying ONNX Runtime DLLs ----------"
          cp -v ../onnxruntime-win-x64-gpu-1.22.1/lib/*.lib ./install/lib/
          cp -v ../onnxruntime-win-x64-gpu-1.22.1/lib/*.dll ./install/lib/

      - name: Build sherpa-onnx node-addon
        shell: bash
        run: |
          # Set env vars again for cmake-js to pick up
          export SHERPA_ONNXRUNTIME_LIB_DIR=$PWD/onnxruntime-win-x64-gpu-1.22.1/lib
          export SHERPA_ONNXRUNTIME_INCLUDE_DIR=$PWD/onnxruntime-win-x64-gpu-1.22.1/include
          
          d=$PWD
          export SHERPA_ONNX_INSTALL_DIR=$d/build/install

          cd scripts/node-addon-api/
          npm i
          ./node_modules/.bin/cmake-js compile --log-level verbose

      - name: Package artifacts
        shell: bash
        run: |
          mkdir -p bin
          mkdir -p artifacts
          
          # Copy .node file
          cp scripts/node-addon-api/build/Release/sherpa-onnx.node bin/
          
          # Copy dependencies (DLLs)
          cp -fv build/install/lib/*.dll bin/
          
          # Tarball
          cd bin && tar -czvf ../artifacts/sherpa-onnx-node-cuda.tar.gz ./* && cd ..
          
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sherpa-onnx-node-cuda.tar.gz
          path: artifacts/sherpa-onnx-node-cuda.tar.gz

  # =================================================================================================
  # Windows CPU Build
  # =================================================================================================
  npm-addon-win-x64:
    runs-on: windows-2022
    steps:
      - name: Clone sherpa-onnx repository
        uses: actions/checkout@v4
        with:
          repository: RaimundoLai/sherpa-onnx
          branch: dev

      - name: Setup Python 3.8
        uses: actions/setup-python@v5
        with:
          python-version: "3.8"

      - uses: actions/setup-node@v4
        with:
          registry-url: 'https://registry.npmjs.org'

      - name: Download ONNX Runtime 1.22.1
        shell: bash
        run: |
          curl -SL -O https://github.com/microsoft/onnxruntime/releases/download/v1.22.1/onnxruntime-win-x64-1.22.1.zip
          unzip -q onnxruntime-win-x64-1.22.1.zip
          rm onnxruntime-win-x64-1.22.1.zip

      - name: Build sherpa-onnx
        shell: bash
        run: |
          export SHERPA_ONNXRUNTIME_LIB_DIR=$PWD/onnxruntime-win-x64-1.22.1/lib
          export SHERPA_ONNXRUNTIME_INCLUDE_DIR=$PWD/onnxruntime-win-x64-1.22.1/include
          
          mkdir build
          cd build
          cmake \
            -Wno-dev \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=./install \
            -DBUILD_SHARED_LIBS=ON \
            -DSHERPA_ONNX_ENABLE_WEBSOCKET=OFF \
            -DSHERPA_ONNX_ENABLE_PORTAUDIO=OFF \
            -DSHERPA_ONNX_ENABLE_BINARY=OFF \
            -DSHERPA_ONNX_ENABLE_GPU=OFF \
            ..

          cmake --build . --config Release --target install -- -m:6
          
          echo "---------- Copying ONNX Runtime DLLs ----------"
          cp -v ../onnxruntime-win-x64-1.22.1/lib/*.lib ./install/lib/
          cp -v ../onnxruntime-win-x64-1.22.1/lib/*.dll ./install/lib/

      - name: Build sherpa-onnx node-addon
        shell: bash
        run: |
          export SHERPA_ONNXRUNTIME_LIB_DIR=$PWD/onnxruntime-win-x64-1.22.1/lib
          export SHERPA_ONNXRUNTIME_INCLUDE_DIR=$PWD/onnxruntime-win-x64-1.22.1/include
          
          d=$PWD
          export SHERPA_ONNX_INSTALL_DIR=$d/build/install
          cd scripts/node-addon-api/
          npm i
          ./node_modules/.bin/cmake-js compile --log-level verbose

      - name: Package artifacts
        shell: bash
        run: |
          mkdir -p bin
          mkdir -p artifacts
          cp scripts/node-addon-api/build/Release/sherpa-onnx.node bin/
          cp -fv build/install/lib/*.dll bin/
          cd bin && tar -czvf ../artifacts/sherpa-onnx-node.tar.gz ./* && cd ..
          
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sherpa-onnx-win-x64.tar.gz
          path: artifacts/sherpa-onnx-node.tar.gz

  # =================================================================================================
  # Linux Build (Following npm-addon-linux-x64.yaml)
  # =================================================================================================
  npm-addon-linux-x64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: RaimundoLai/sherpa-onnx
          branch: dev

      - uses: actions/setup-node@v4
        with:
          registry-url: 'https://registry.npmjs.org'

      - name: Build sherpa-onnx
        uses: addnab/docker-run-action@v3
        with:
            image: quay.io/pypa/manylinux2014_x86_64
            options: |
              --volume ${{ github.workspace }}/:/shared/
            shell: bash
            run: |
              uname -a
              gcc --version
              cmake --version
              cd /shared

              # Install Rust for tokenizers_cpp
              curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
              source $HOME/.cargo/env

              # Download ONNX Runtime 1.22.0 shared lib (glibc2_17 compatible, has libonnxruntime.so)
              curl -SL -O https://github.com/csukuangfj/onnxruntime-libs/releases/download/v1.22.0/onnxruntime-linux-x64-glibc2_17-Release-1.22.0.zip
              unzip onnxruntime-linux-x64-glibc2_17-Release-1.22.0.zip

              export SHERPA_ONNXRUNTIME_LIB_DIR=$PWD/onnxruntime-linux-x64-glibc2_17-Release-1.22.0/lib
              export SHERPA_ONNXRUNTIME_INCLUDE_DIR=$PWD/onnxruntime-linux-x64-glibc2_17-Release-1.22.0/include

              ls -lh $SHERPA_ONNXRUNTIME_LIB_DIR/

              mkdir build
              cd build
              cmake \
                -DCMAKE_INSTALL_PREFIX=./install \
                -DBUILD_SHARED_LIBS=ON \
                -DSHERPA_ONNX_ENABLE_WEBSOCKET=OFF \
                -DSHERPA_ONNX_ENABLE_PORTAUDIO=OFF \
                -DSHERPA_ONNX_ENABLE_BINARY=OFF \
                ..
              make -j install

      - name: Build sherpa-onnx node-addon
        shell: bash
        run: |
          d=$PWD
          export SHERPA_ONNX_INSTALL_DIR=$d/build/install

          sudo mkdir /shared
          sudo ln -s $PWD/build /shared/

          ls -lh /shared/build

          cd scripts/node-addon-api/

          npm i

          ./node_modules/.bin/cmake-js compile --log-level verbose

      - name: Package artifacts
        shell: bash
        run: |
          mkdir -p bin
          mkdir -p artifacts
          
          # Fix permissions from Docker
          sudo chown -R $USER:$USER .
          
          # Copy compiled node addon
          cp scripts/node-addon-api/build/Release/sherpa-onnx.node bin/
          
          # Copy shared libraries (.so)
          cp -fv build/install/lib/lib*.so* bin/
          
          # Tarball
          cd bin && tar -czvf ../artifacts/sherpa-onnx-linux-x64.tar.gz ./* && cd ..

      - uses: actions/upload-artifact@v4
        with:
          name: sherpa-onnx-linux-x64.tar.gz
          path: artifacts/sherpa-onnx-linux-x64.tar.gz

  # =================================================================================================
  # Linux CUDA Build (Following linux-gpu.yaml)
  # =================================================================================================
  npm-addon-linux-x64-cuda:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: RaimundoLai/sherpa-onnx
          branch: dev

      - uses: actions/setup-node@v4
        with:
          registry-url: 'https://registry.npmjs.org'

      - name: Build sherpa-onnx
        uses: addnab/docker-run-action@v3
        with:
            image: quay.io/pypa/manylinux_2_28_x86_64
            options: |
              --volume ${{ github.workspace }}/:/home/runner/work/sherpa-onnx/sherpa-onnx
            shell: bash
            run: |
              uname -a
              gcc --version
              cmake --version
              cd /home/runner/work/sherpa-onnx/sherpa-onnx

              # Install Rust for tokenizers_cpp
              curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
              source $HOME/.cargo/env

              # Download patched ONNX Runtime GPU
              curl -SL -O https://github.com/csukuangfj/onnxruntime-libs/releases/download/v1.22.0/onnxruntime-linux-x64-gpu-1.22.0-patched.zip
              unzip onnxruntime-linux-x64-gpu-1.22.0-patched.zip

              export SHERPA_ONNXRUNTIME_LIB_DIR=$PWD/onnxruntime-linux-x64-gpu-1.22.0-patched/lib
              export SHERPA_ONNXRUNTIME_INCLUDE_DIR=$PWD/onnxruntime-linux-x64-gpu-1.22.0-patched/include

              ls -lh $SHERPA_ONNXRUNTIME_LIB_DIR/libonnxruntime.so

              mkdir build
              cd build

              cmake \
                -DCMAKE_INSTALL_PREFIX=./install \
                -DBUILD_SHARED_LIBS=ON \
                -DSHERPA_ONNX_ENABLE_WEBSOCKET=OFF \
                -DSHERPA_ONNX_ENABLE_PORTAUDIO=OFF \
                -DSHERPA_ONNX_ENABLE_BINARY=OFF \
                -DSHERPA_ONNX_ENABLE_GPU=ON \
                ..

              make -j2
              make install

              echo "---------- Copying ONNX Runtime GPU libs ----------"
              cp -v ../onnxruntime-linux-x64-gpu-1.22.0-patched/lib/*.so* ./install/lib/

              ls -lh install/lib

      - name: Build sherpa-onnx node-addon
        shell: bash
        run: |
          d=$PWD
          export SHERPA_ONNX_INSTALL_DIR=$d/build/install

          sudo mkdir /shared
          sudo ln -s $PWD/build /shared/

          ls -lh /shared/build

          cd scripts/node-addon-api/

          npm i

          ./node_modules/.bin/cmake-js compile --log-level verbose

      - name: Package artifacts
        shell: bash
        run: |
          mkdir -p bin
          mkdir -p artifacts
          
          # Fix permissions from Docker
          sudo chown -R $USER:$USER .
          
          # Copy compiled node addon
          cp scripts/node-addon-api/build/Release/sherpa-onnx.node bin/
          
          # Copy shared libraries (.so) including ONNX Runtime GPU libs
          cp -fv build/install/lib/lib*.so* bin/
          
          # Tarball
          cd bin && tar -czvf ../artifacts/sherpa-onnx-linux-x64-cuda.tar.gz ./* && cd ..

      - uses: actions/upload-artifact@v4
        with:
          name: sherpa-onnx-linux-x64-cuda.tar.gz
          path: artifacts/sherpa-onnx-linux-x64-cuda.tar.gz

  # =================================================================================================
  # macOS Build (Intel & ARM64)
  # =================================================================================================
  npm-addon-macos:
    name: macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            arch: x64
            onnxruntime_arch: x86_64
            output_name: sherpa-onnx-macos-x64
          - os: macos-14
            arch: arm64
            onnxruntime_arch: arm64
            output_name: sherpa-onnx-macos-arm64

    steps:
      - uses: actions/checkout@v4
        with:
          repository: RaimundoLai/sherpa-onnx
          branch: dev

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ matrix.os }}-${{ matrix.arch }}

      - name: Download ONNX Runtime 1.22.0
        shell: bash
        run: |
          curl -SL -O https://github.com/microsoft/onnxruntime/releases/download/v1.22.0/onnxruntime-osx-${{ matrix.onnxruntime_arch }}-1.22.0.tgz
          tar xzf onnxruntime-osx-${{ matrix.onnxruntime_arch }}-1.22.0.tgz
          rm onnxruntime-osx-${{ matrix.onnxruntime_arch }}-1.22.0.tgz
          mv onnxruntime-osx-${{ matrix.onnxruntime_arch }}-1.22.0 onnxruntime
          ls -lh onnxruntime/lib

      - name: Build sherpa-onnx
        shell: bash
        run: |
          export CMAKE_CXX_COMPILER_LAUNCHER=ccache
          export PATH="/usr/lib/ccache:/usr/local/opt/ccache/libexec:$PATH"
          
          export SHERPA_ONNXRUNTIME_LIB_DIR=$PWD/onnxruntime/lib
          export SHERPA_ONNXRUNTIME_INCLUDE_DIR=$PWD/onnxruntime/include
          
          mkdir build
          cd build
          cmake \
            -Wno-dev \
            -DCMAKE_INSTALL_PREFIX=./install \
            -DBUILD_SHARED_LIBS=ON \
            -DSHERPA_ONNX_ENABLE_WEBSOCKET=OFF \
            -DSHERPA_ONNX_ENABLE_PORTAUDIO=OFF \
            -DSHERPA_ONNX_ENABLE_BINARY=OFF \
            -DCMAKE_OSX_ARCHITECTURES='${{ matrix.arch == 'arm64' && 'arm64' || 'x86_64' }}' \
            ..
          make -j4 install

      - name: Build sherpa-onnx node-addon
        shell: bash
        run: |
          export PATH="/usr/lib/ccache:/usr/local/opt/ccache/libexec:$PATH"
          
          export SHERPA_ONNXRUNTIME_LIB_DIR=$PWD/onnxruntime/lib
          export SHERPA_ONNXRUNTIME_INCLUDE_DIR=$PWD/onnxruntime/include
          
          d=$PWD
          export SHERPA_ONNX_INSTALL_DIR=$d/build/install
          cd scripts/node-addon-api/
          npm i
          ./node_modules/.bin/cmake-js compile --log-level verbose

      - name: Package artifacts
        shell: bash
        run: |
          mkdir -p bin
          mkdir -p artifacts
          
          # Copy node addon
          cp scripts/node-addon-api/build/Release/sherpa-onnx.node bin/
          
          # Copy dylibs
          cp -fv build/install/lib/lib*.dylib bin/
          
          # Tarball
          cd bin && tar -czvf ../artifacts/${{ matrix.output_name }}.tar.gz ./* && cd ..

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.output_name }}.tar.gz
          path: artifacts/${{ matrix.output_name }}.tar.gz

  # =================================================================================================
  # Release
  # =================================================================================================
  create-update-release:
    needs: [npm-addon-win-x64, npm-addon-win-x64-cuda, npm-addon-linux-x64, npm-addon-linux-x64-cuda, npm-addon-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          
      - name: List artifacts
        run: ls -R artifacts/
        
      - name: Get current date
        id: date
        run: echo "date=$(date +'%Y%m%d-%H%M%S')" >> $GITHUB_OUTPUT
        
      - name: Create Timestamped Release
        uses: softprops/action-gh-release@v1
        if: github.event_name != 'pull_request'
        with:
          tag_name: release-${{ steps.date.outputs.date }}
          name: npm-addon builds ${{ steps.date.outputs.date }}
          body: |
             npm-addon builds (Build date: ${{ steps.date.outputs.date }})
             
             **Windows**
             - Windows (x64)
             - Windows (x64 with CUDA 12.x / ORT 1.22.1)
             
             **Linux**
             - Linux (x64, Manylinux2_28)
             - Linux (x64 with CUDA 12.x / ORT 1.22.0)
             
             **macOS**
             - macOS (Intel x64)
             - macOS (ARM64 Apple Silicon)
          files: |
            artifacts/**/*.tar.gz
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Update Latest Release
        uses: softprops/action-gh-release@v1
        if: github.event_name != 'pull_request'
        with:
          tag_name: latest
          name: Latest npm-addon builds
          body: |
            Latest npm-addon builds.
            Last updated: ${{ steps.date.outputs.date }}
            
            **Windows**
            - Windows (x64)
            - Windows (x64 with CUDA 12.x / ORT 1.22.1)
            
            **Linux**
            - Linux (x64, Manylinux2_28)
            - Linux (x64 with CUDA 12.x / ORT 1.22.0)
            
            **macOS**
            - macOS (Intel x64)
            - macOS (ARM64 Apple Silicon)
          files: |
            artifacts/**/*.tar.gz
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}