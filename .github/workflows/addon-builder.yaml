  npm-addon-linux-x64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: RaimundoLai/sherpa-onnx
          ref: dev

      - uses: actions/setup-node@v4
        with:
          registry-url: https://registry.npmjs.org

      - name: Build sherpa-onnx
        uses: addnab/docker-run-action@v3
        with:
          image: quay.io/pypa/manylinux2014_x86_64
          options: |
            --volume ${{ github.workspace }}/:/shared/
          shell: bash
          run: |
            cd /shared
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
            source $HOME/.cargo/env
            curl -SL -O https://github.com/csukuangfj/onnxruntime-libs/releases/download/v1.28.2/onnxruntime-linux-x64-glibc2_17-Release-1.28.2.zip
            unzip -q onnxruntime-linux-x64-glibc2_17-Release-1.28.2.zip
            rm onnxruntime-linux-x64-glibc2_17-Release-1.28.2.zip
            export SHERPA_ONNXRUNTIME_LIB_DIR=$PWD/onnxruntime-linux-x64-glibc2_17-Release-1.28.2/lib
            export SHERPA_ONNXRUNTIME_INCLUDE_DIR=$PWD/onnxruntime-linux-x64-glibc2_17-Release-1.28.2/include
            mkdir build
            cd build
            cmake \
              -DCMAKE_INSTALL_PREFIX=./install \
              -DBUILD_SHARED_LIBS=ON \
              -DSHERPA_ONNX_ENABLE_WEBSOCKET=OFF \
              -DSHERPA_ONNX_ENABLE_PORTAUDIO=OFF \
              -DSHERPA_ONNX_ENABLE_BINARY=OFF \
              ..
            make -j2 install

      - name: Build sherpa-onnx node-addon
        shell: bash
        run: |
          export SHERPA_ONNX_INSTALL_DIR=$PWD/build/install
          sudo mkdir /shared
          sudo ln -s $PWD/build /shared/
          cd scripts/node-addon-api/
          npm i
          ./node_modules/.bin/cmake-js compile --log-level verbose

      - name: Package artifact
        shell: bash
        run: |
          sudo chown -R $USER:$USER .
          mkdir -p bin artifacts
          cp scripts/node-addon-api/build/Release/sherpa-onnx.node bin/
          cp -fv build/install/lib/lib*.so* bin/
          cd bin && tar -czvf ../artifacts/sherpa-onnx-linux-x64.tar.gz ./*

      - uses: actions/upload-artifact@v4
        with:
          name: sherpa-onnx-linux-x64.tar.gz
          path: artifacts/sherpa-onnx-linux-x64.tar.gz

