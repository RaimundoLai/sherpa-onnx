  npm-addon-macos:
    name: macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    env:
      MACOSX_DEPLOYMENT_TARGET: '12.0'
    strategy:
      fail-fast: false
      matrix:
        include:
          # Keep the existing Intel build/version.
          - os: macos-15-intel
            arch: x64
            onnxruntime_arch: x86_64
            onnxruntime_version: 1.22.0
            output_name: sherpa-onnx-macos-x64
          # Use the requested Apple Silicon package.
          - os: macos-14
            arch: arm64
            onnxruntime_arch: arm64
            onnxruntime_version: 1.28.2
            output_name: sherpa-onnx-macos-arm64

    steps:
      - uses: actions/checkout@v4
        with:
          repository: RaimundoLai/sherpa-onnx
          ref: dev

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ matrix.os }}-${{ matrix.arch }}

      - name: Download ONNX Runtime
        shell: bash
        run: |
          archive="onnxruntime-osx-${{ matrix.onnxruntime_arch }}-${{ matrix.onnxruntime_version }}.tgz"
          curl -SL -o "$archive" "https://github.com/microsoft/onnxruntime/releases/download/v${{ matrix.onnxruntime_version }}/$archive"
          tar xzf "$archive"
          rm "$archive"
          mv "${archive%.tgz}" onnxruntime
          ls -lh onnxruntime/lib

      - name: Build sherpa-onnx
        shell: bash
        run: |
          export CMAKE_CXX_COMPILER_LAUNCHER=ccache
          export PATH="/usr/lib/ccache:/usr/local/opt/ccache/libexec:$PATH"
          export SHERPA_ONNXRUNTIME_LIB_DIR=$PWD/onnxruntime/lib
          export SHERPA_ONNXRUNTIME_INCLUDE_DIR=$PWD/onnxruntime/include
          mkdir build
          cd build
          cmake \
            -Wno-dev \
            -DCMAKE_INSTALL_PREFIX=./install \
            -DBUILD_SHARED_LIBS=ON \
            -DSHERPA_ONNX_ENABLE_WEBSOCKET=OFF \
            -DSHERPA_ONNX_ENABLE_PORTAUDIO=OFF \
            -DSHERPA_ONNX_ENABLE_BINARY=OFF \
            -DCMAKE_OSX_DEPLOYMENT_TARGET='12.0' \
            -DCMAKE_OSX_ARCHITECTURES='${{ matrix.arch == 'arm64' && 'arm64' || 'x86_64' }}' \
            ..
          make -j4 install

      - name: Build sherpa-onnx node-addon
        shell: bash
        run: |
          export PATH="/usr/lib/ccache:/usr/local/opt/ccache/libexec:$PATH"
          export SHERPA_ONNXRUNTIME_LIB_DIR=$PWD/onnxruntime/lib
          export SHERPA_ONNXRUNTIME_INCLUDE_DIR=$PWD/onnxruntime/include
          export SHERPA_ONNX_INSTALL_DIR=$PWD/build/install
          cd scripts/node-addon-api/
          npm i
          ./node_modules/.bin/cmake-js compile --log-level verbose --CDCMAKE_OSX_DEPLOYMENT_TARGET=12.0

      - name: Package artifact
        shell: bash
        run: |
          mkdir -p bin artifacts
          cp scripts/node-addon-api/build/Release/sherpa-onnx.node bin/
          cp -fv build/install/lib/lib*.dylib bin/
          cd bin && tar -czvf ../artifacts/${{ matrix.output_name }}.tar.gz ./*

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.output_name }}.tar.gz
          path: artifacts/${{ matrix.output_name }}.tar.gz

  create-update-release:
    needs:
      - npm-addon-win-x64
      - npm-addon-win-x64-cuda
      - npm-addon-win-x64-cuda13
      - npm-addon-linux-x64
      - npm-addon-linux-x64-cuda
      - npm-addon-linux-x64-cuda13
      - npm-addon-macos
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: ls -R artifacts/

      - name: Get current date
        id: date
        run: echo "date=$(date +'%Y%m%d-%H%M%S')" >> "$GITHUB_OUTPUT"

      - name: Create Timestamped Release
        uses: softprops/action-gh-release@v1
        if: github.event_name != 'pull_request'
        with:
          tag_name: release-${{ steps.date.outputs.date }}
          name: npm-addon builds ${{ steps.date.outputs.date }}
          body: |
            npm-addon builds (Build date: ${{ steps.date.outputs.date }})

            **Windows**
            - Windows x64 CPU / ORT 1.28.2
            - Windows x64 CUDA 12 / ORT 1.28.2
            - Windows x64 CUDA 13 / ORT 1.28.2

            **Linux**
            - Linux x64 CPU / ORT 1.28.2
            - Linux x64 CUDA 12 / ORT 1.28.2
            - Linux x64 CUDA 13 / ORT 1.28.2

            **macOS**
            - macOS Intel x64 / ORT 1.22.0 (kept from the existing build)
            - macOS ARM64 Apple Silicon / ORT 1.28.2
          files: artifacts/**/*.tar.gz
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Latest Release
        uses: softprops/action-gh-release@v1
        if: github.event_name != 'pull_request'
        with:
          tag_name: latest
          name: Latest npm-addon builds
          body: |
            Latest npm-addon builds.
            Last updated: ${{ steps.date.outputs.date }}

            Windows: CPU, CUDA 12 and CUDA 13, all using ORT 1.28.2.
            Linux: CPU, CUDA 12 and CUDA 13, all using ORT 1.28.2.
            macOS Intel: ORT 1.22.0; macOS ARM64: ORT 1.28.2.
          files: artifacts/**/*.tar.gz
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
