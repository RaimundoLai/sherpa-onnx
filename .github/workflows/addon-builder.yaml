name: Build npm-addon

on:
  push:
    branches:
      - builder
  workflow_dispatch:

jobs:
  npm-addon-win-x64-cuda:
    runs-on: windows-2022
    steps:
      - name: Clone sherpa-onnx repository
        uses: actions/checkout@v4
        with:
          repository: RaimundoLai/sherpa-onnx
          ref: dev

      - name: Setup Python 3.8
        uses: actions/setup-python@v5
        with:
          python-version: "3.8"

      - uses: actions/setup-node@v4
        with:
          registry-url: https://registry.npmjs.org

      - name: Download ONNX Runtime 1.28.2 CUDA 12
        shell: bash
        run: |
          curl -SL -O https://github.com/microsoft/onnxruntime/releases/download/v1.28.2/onnxruntime-win-x64-gpu_cuda12-1.28.2.zip
          unzip -q onnxruntime-win-x64-gpu_cuda12-1.28.2.zip
          rm onnxruntime-win-x64-gpu_cuda12-1.28.2.zip

      - name: Build sherpa-onnx (CUDA 12)
        shell: bash
        run: |
          export SHERPA_ONNXRUNTIME_LIB_DIR=$PWD/onnxruntime-win-x64-gpu_cuda12-1.28.2/lib
          export SHERPA_ONNXRUNTIME_INCLUDE_DIR=$PWD/onnxruntime-win-x64-gpu_cuda12-1.28.2/include
          mkdir build
          cd build
          cmake \
            -Wno-dev \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=./install \
            -DBUILD_SHARED_LIBS=ON \
            -DSHERPA_ONNX_ENABLE_WEBSOCKET=OFF \
            -DSHERPA_ONNX_ENABLE_PORTAUDIO=OFF \
            -DSHERPA_ONNX_ENABLE_BINARY=OFF \
            -DSHERPA_ONNX_ENABLE_GPU=ON \
            ..
          cmake --build . --config Release --target install -- -m:6
          cp -v ../onnxruntime-win-x64-gpu_cuda12-1.28.2/lib/*.lib ./install/lib/
          cp -v ../onnxruntime-win-x64-gpu_cuda12-1.28.2/lib/*.dll ./install/lib/

      - name: Build sherpa-onnx node-addon
        shell: bash
        run: |
          export SHERPA_ONNXRUNTIME_LIB_DIR=$PWD/onnxruntime-win-x64-gpu_cuda12-1.28.2/lib
          export SHERPA_ONNXRUNTIME_INCLUDE_DIR=$PWD/onnxruntime-win-x64-gpu_cuda12-1.28.2/include
          export SHERPA_ONNX_INSTALL_DIR=$PWD/build/install
          cd scripts/node-addon-api/
          npm i
          ./node_modules/.bin/cmake-js compile --log-level verbose

      - name: Package artifact
        shell: bash
        run: |
          mkdir -p bin artifacts
          cp scripts/node-addon-api/build/Release/sherpa-onnx.node bin/
          cp -fv build/install/lib/*.dll bin/
          # Keep the published addon archive as tar.gz for existing consumers.
          cd bin && tar -czvf ../artifacts/sherpa-onnx-node-cuda.tar.gz ./*

      - uses: actions/upload-artifact@v4
        with:
          name: sherpa-onnx-node-cuda.tar.gz
          path: artifacts/sherpa-onnx-node-cuda.tar.gz

